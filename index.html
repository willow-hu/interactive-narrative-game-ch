<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>互动剧情游戏demo</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- 游戏主容器 -->
    <div id="gameContainer">
        <!-- 背景图片 -->
        <div id="background"></div>
        
        <!-- NPC立绘 -->
        <div id="npcCharacter" style="display: none;"></div>
        
        <!-- 右上角按钮组 -->
        <div id="topRightButtons">
            <button id="exitButton" style="display: none;">退出</button>
            <button id="historyButton" style="display: none;">历史对话</button>
        </div>
        
        <!-- 开始游戏界面 -->
        <div id="startScreen">
            <h2 id="tutorialPrompt">是否观看游戏教程？</h2>
            <button id="startGameButton">我是新手，需要教程</button>
            <button id="skipTutorialButton">我很熟练了，不需要教程</button>
        </div>
        
        <!-- 游戏主界面 -->
        <div id="gameScreen" style="display: none;">
            <!-- NPC对话框 -->
            <div id="dialogueBox">
                <div id="roleName"></div>
                <div id="npcText"></div>
                <div id="skipHint">点击跳过</div>
                <button id="continueButton">继续</button>
                <button id="completeButton">完成</button>
            </div>
        </div>
        
        <!-- 选项遮罩层 -->
        <div id="optionsOverlay" style="display: none;">
            <div id="optionsContainer"></div>
        </div>
        
        <!-- 历史对话弹窗 -->
        <div id="historyModal" style="display: none;">
            <div id="historyContent">
                <div id="historyHeader">
                    <h3>历史对话</h3>
                    <button id="closeHistoryButton">×</button>
                </div>
                <div id="historyList"></div>
            </div>
        </div>
        
        <!-- 确认对话框 -->
        <div id="confirmModal" style="display: none;">
            <div id="confirmContent">
                <p id="confirmText"></p>
                <div id="confirmButtons">
                    <button id="confirmYes">是</button>
                    <button id="confirmNo">否</button>
                </div>
            </div>
        </div>
        
        <!-- 成就弹窗 -->
        <div id="achievementModal" style="display: none;">
            <div id="achievementContent">
                <p id="achievementText"></p>
                <button id="achievementConfirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 脚本文件 -->
    <script src="scripts/safariCompat.js"></script>
    <script src="scripts/gameData.js"></script>
    <script src="scripts/gameState.js"></script>
    <script src="scripts/navigationManager.js"></script>
    <script src="scripts/uiManager.js"></script>
    <script src="scripts/gameEngine.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
