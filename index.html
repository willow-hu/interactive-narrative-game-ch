<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互动剧情游戏 - 上传游戏资源</title>
    <link rel="stylesheet" href="styles/upload.css">
</head>
<body>
    <div id="uploadContainer">
        <div id="uploadBox">
            <h1>互动剧情游戏</h1>
            <p class="subtitle">上传您的游戏资源开始游戏</p>
            
            <div id="uploadArea">
                <div id="gameList" style="display: none;">
                    <h3>已有游戏</h3>
                    <div id="existingGames"></div>
                    <div class="divider">或</div>
                </div>
                
                <div id="uploadForm">
                    <h3>上传自定义游戏</h3>
                    <div class="form-group">
                        <label for="gameName">游戏名称：</label>
                        <input type="text" id="gameName" placeholder="请输入游戏名称（英文字母和数字）" />
                    </div>
                    
                    <div class="form-group">
                        <label for="zipFile">游戏资源包：</label>
                        <input type="file" id="zipFile" accept=".zip" />
                        <p class="hint">请上传游戏资源压缩包</p>
                    </div>
                    
                    <button id="uploadButton" disabled>上传并开始游戏</button>
                </div>
            </div>
            
            <div id="presetGameLink">
                <button class="preset-game-button" onclick="window.location.href='game.html?site=sample'">
                    体验预设游戏：苏州双塔
                </button>
            </div>
            
            <div id="progressArea" style="display: none;">
                <div id="progressBar">
                    <div id="progressFill"></div>
                </div>
                <p id="progressText">正在处理...</p>
            </div>
            
            <div id="errorMessage" style="display: none;"></div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="scripts/upload.js"></script>
</body>
</html>
